      stats: resumen(kms, "km", 1, "km"),
      dibuja: c => lineChart(c, kms, "km", { unit: "km", zero: true, color: PAL.steel, h: 430 }),
    });
  }

  if (pulso.length >= 2) {
    // dos líneas en la misma caja: el máximo dice cuánto aprietas, el medio
    // cuánto tiempo pasas apretando
    dobleLinea($("#c-hr"), pulso, ["mh", "ah"], [PAL.down, PAL.steel],
               ["máximo", "medio"], "ppm");
    $("#c-hr").closest(".card").classList.add("zoomable");
    ampliable($("#c-hr").closest(".card"), {
      titulo: "Pulso", nota: "Pulso medio y máximo del día",
      stats: resumen(pulso.filter(x => x.ah != null), "ah", 0, "ppm"),
      dibuja: c => dobleLinea(c, pulso, ["mh", "ah"], [PAL.down, PAL.steel],
                              ["máximo", "medio"], "ppm", 430),
    });
  }

  const fases = [["sd", "sr", "sli"], ["#2a78d6", "#5598e7", "#9ec5f4"],
                 ["profundo", "REM", "ligero"]];
  stackChart($("#c-sl"), noches, ...fases, { label: "Fases del sueño" });
  $("#c-sl").closest(".card").classList.add("zoomable");
  ampliable($("#c-sl").closest(".card"), {
    titulo: "Sueño", nota: "Fases por noche, sin contar el tiempo despierto",
    stats: resumen(noches, "sl", 1, "h"),
    dibuja: c => stackChart(c, noches, ...fases, { h: 420 }),
  });
}

/* ---------- peso ----------
   Un pesaje suelto no es tu peso: se mueve ~0,6 kg de un día a otro por agua,
   sal y la hora a la que te subes. La tendencia (mediana de 7 días) y las
   ventanas con referencia cercana son lo que hace comparable un día con otro.

   Aquí van también la altura (que no la da ninguna fuente, pero sale de
   peso e IMC), el FFMI y la cintura/altura.                                 */

function tarjetaPeso(b) {
  const c = IN.cuerpo || {}, pf = IN.perfil || {};
  const t = c.tendencia || {};
  const last = b[b.length - 1];

  const dl = (v, n, dec = 1, bueno = false) => v == null
    ? `<td title="No hay pesaje cerca de esa fecha">—</td>`
    : `<td title="${n} días reales">${delta(v, 0, { dec, bueno })}</td>`;

  return `<div class="card">
    <h3>Peso</h3>
    <p class="note">La tendencia es la mediana de los pesajes de 7 días: un
      pesaje suelto se mueve ~0,6 kg de un día a otro por agua y por la hora</p>
    <div class="tiles wide">
      <div class="tile hl"><span class="v">${num(t.actual ?? last.kg, 1)}<em>kg</em></span>
        <span class="l">Peso (tendencia)</span></div>
      <div class="tile"><span class="v">${num(last.kg, 1)}<em>kg</em></span>
        <span class="l">Último pesaje · ${longd(last.d)}</span></div>
      ${pf.magra_kg ? `<div class="tile"><span class="v">${num(pf.magra_kg, 1)}<em>kg</em></span>
        <span class="l">Masa magra estimada</span></div>` : ""}
      ${pf.ffmi ? `<div class="tile"><span class="v">${num(pf.ffmi, 1)}</span>
        <span class="l">FFMI (máx ${num(pf.ffmi_max, 1)})</span></div>` : ""}
      ${pf.cintura_altura ? `<div class="tile"><span class="v ${
        pf.cintura_altura < 0.5 ? "up" : "down"}">${num(pf.cintura_altura, 2)}</span>
        <span class="l">${pf.cintura_es_abdomen ? "Abdomen" : "Cintura"}/altura</span></div>` : ""}
      ${pf.altura_m ? `<div class="tile"><span class="v">${num(pf.altura_m, 2)}<em>m</em></span>
        <span class="l">Altura (de peso e IMC)</span></div>` : ""}
    </div>
    ${t.actual != null ? `<table class="cmp" style="margin-top:6px">
      <thead><tr><th></th><th>Ahora</th><th>7 d</th><th>30 d</th><th>90 d</th></tr></thead>
      <tbody><tr><td>Tendencia</td><td>${num(t.actual, 1)} kg</td>
        ${dl(t.d7, t.n7)}${dl(t.d30, t.n30)}${dl(t.d90, t.n90)}</tr></tbody></table>
      <p class="note" style="margin-top:10px">Una casilla vacía es que no había
      pesaje cerca de esa fecha. Antes se cogía el más reciente que hubiera, y
      la columna de 7 días podía estar enseñando el cambio de un mes.</p>` : ""}
    ${pf.cintura_altura ? `<p class="note" style="margin-top:4px">
      ${pf.cintura_es_abdomen ? "Se usa el abdomen porque la cintura no se ha medido aún. " : ""}
      Por debajo de <b>0,50</b> es el objetivo de salud habitual; estás en
      <b>${num(pf.cintura_altura, 2)}</b> con ${num(pf.abdomen_cm ?? pf.cintura_cm, 1)} cm
      medidos el ${longd(pf.cintura_fecha)}.</p>` : ""}
  </div>`;
}

function sectionCuerpo() {
  const el = $("#sec-cuerpo");
  const b = DATA.daily.filter(x => x.kg != null);
  if (!b.length) {
    // puede no haber pesajes y si haber medidas de cinta: se meten a mano
    const solaCinta = bloqueMedidas();
    el.innerHTML = solaCinta.html
      ? `<div class="cards">${solaCinta.html}</div>`
      : `<div class="card"><h3>Cuerpo</h3><p class="blank">Sin pesajes todavía.</p></div>`;
    solaCinta.pintar();
    return;
  }

  // clave, etiqueta, unidad, decimales, si subir es bueno (null = neutro)
  const M = [
    ["kg", "Peso",               "kg",   1, false],
    ["fa", "Grasa corporal",     "%",    1, false],
    ["fm", "Grasa",              "kg",   1, false],
    ["mu", "Masa muscular",      "kg",   1, true ],
    ["sk", "Músculo esquelético","%",    1, true ],
    ["lm", "Masa magra",         "kg",   1, true ],
    ["wa", "Agua corporal",      "%",    1, true ],
    ["pr", "Proteína",           "%",    1, true ],
    ["vi", "Grasa visceral",     "",     1, false],
    ["sc", "Grasa subcutánea",   "%",    1, false],
    ["bmi","IMC",                "",     1, false],
    ["bo", "Masa ósea",          "kg",   1, null ],
    ["br", "Metabolismo basal",  "kcal", 0, null ],
    ["ag", "Edad corporal",      "años", 0, false],
  ].filter(([k]) => b.some(x => x[k] != null));

  const last = b[b.length - 1];
  // referencia: el pesaje mas cercano a hace 30 dias
  const objetivo = new Date(last.d + "T00:00"); objetivo.setDate(objetivo.getDate() - 30);
  let ref = b[0];
  for (const x of b) if (new Date(x.d + "T00:00") <= objetivo) ref = x;

  const tiles = M.map(([k, lbl, u, dec, bueno]) => {
    const v = last[k], p = ref[k];
    let delta = "";
    if (v != null && p != null && ref !== last) {
      const d = v - p;
      const cls = bueno === null || Math.abs(d) < 0.05 ? "flat"
                : (d > 0) === bueno ? "up" : "down";
      delta = `<span class="chg ${cls}">${d > 0 ? "+" : ""}${d.toFixed(dec)}</span>`;
    }
    return `<div class="tile">
      <span class="v">${v != null ? v.toFixed(dec) : "—"}<em>${u}</em></span>
      <span class="l">${lbl}</span>${delta}</div>`;
  }).join("");

  const charts = M.filter(([k]) => b.filter(x => x[k] != null).length >= 2)
    .map(([k, lbl, u]) => `<div class="mini"><h4>${lbl}</h4><div id="cb-${k}"></div></div>`)
    .join("");

  const cols = ["d", ...M.map(([k]) => k)];
  const filas = [...b].reverse().slice(0, 20).map(x => `<tr>
      <td>${longd(x.d)}</td>
      ${M.map(([k, , , dec]) => `<td>${x[k] != null ? x[k].toFixed(dec) : "—"}</td>`).join("")}
    </tr>`).join("");

  const cinta = bloqueMedidas();

  el.innerHTML = `<div class="cards">
    <div class="card">
      <h3>Ahora mismo</h3>
      <p class="note">${longd(last.d)} · el cambio es frente a hace 30 días</p>
      <div class="tiles wide">${tiles}</div>
    </div>
    <div class="card">
      <h3>Evolución</h3>
      <p class="note">${b.length} pesajes desde ${longd(b[0].d)}</p>
      <div class="minigrid">${charts}</div>
    </div>
    <div class="card">
      <h3>Últimos pesajes</h3>
      <div class="tblwrap"><table>
        <thead><tr><th>Fecha</th>${M.map(([, l, u]) =>
          `<th>${l}${u ? " (" + u + ")" : ""}</th>`).join("")}</tr></thead>
        <tbody>${filas}</tbody></table></div>
    </div>
    ${cinta.html}
    ${tarjetaPeso(b)}
  </div>`;

  const color = { fa: PAL.down, fm: PAL.down, sc: PAL.down, vi: PAL.down,
                  mu: PAL.up, sk: PAL.up, lm: PAL.up, pr: PAL.up, wa: PAL.steel };
  M.forEach(([k, lbl, u, dec]) => {
    const box = $("#cb-" + k);
    if (!box) return;
    const col = color[k] || PAL.brass;
    lineChart(box, b, k, { color: col, unit: u, label: lbl, h: 150 });
    ampliable(box.closest(".mini"), {
      titulo: lbl, nota: `${b.filter(x => x[k] != null).length} pesajes desde ${longd(b[0].d)}`,
      stats: resumen(b, k, dec, u),
      dibuja: c => lineChart(c, b, k, { color: col, unit: u, h: 430 }),
    });
  });

  cinta.pintar();
}

/* ---------- medidas de cinta ----------
   Van dentro de "Cuerpo" y no en una pestana propia: son dato corporal, y
   con dos metricas al principio una pestana entera quedaria vacia.

   La referencia NO es "hace 30 dias" como en los pesajes, sino la tanda
   anterior: estas medidas se toman cada semana y lo que interesa es que ha
   cambiado desde la ultima vez.                                            */

function bloqueMedidas() {
  const CLAVES = [
    ["tcu", "Cuello",           null],
    ["tpe", "Pecho",            null],
    ["tci", "Cintura",          false],
    ["tab", "Abdomen",          false],
    ["tca", "Cadera",           false],
    ["tbi", "Brazo izq.",       null],
    ["tbd", "Brazo der.",       null],
    ["tai", "Antebrazo izq.",   null],
    ["tad", "Antebrazo der.",   null],
    ["tmi", "Muslo izq.",       null],
    ["tmd", "Muslo der.",       null],
    ["tgi", "Gemelo izq.",      null],
    ["tgd", "Gemelo der.",      null],
  ];

  const t = DATA.daily.filter(x => CLAVES.some(([k]) => x[k] != null));
  if (!t.length) return { html: "", pintar: () => {} };

  // solo las que se han medido alguna vez: lo que no se mide no se pinta
  const M = CLAVES.filter(([k]) => t.some(x => x[k] != null));
  const last = t[t.length - 1];
  const prev = t.length > 1 ? t[t.length - 2] : null;

  const tiles = M.map(([k, lbl, bueno]) => {
    const v = last[k], p = prev ? prev[k] : null;
    let chg = "";
    if (v != null && p != null) {
      const d = v - p;
      // sin criterio de "mejor" en las extremidades: crecer un brazo es
      // bueno y crecer otra cosa depende del objetivo, asi que solo se
      // colorean cintura, abdomen y cadera, que si son marcador de grasa
      const cls = bueno === null || Math.abs(d) < 0.05 ? "flat"
                : (d > 0) === bueno ? "up" : "down";
      chg = `<span class="chg ${cls}">${d > 0 ? "+" : ""}${d.toFixed(1)}</span>`;
    }
    return `<div class="tile">
      <span class="v">${v != null ? v.toFixed(1) : "—"}<em>cm</em></span>
      <span class="l">${lbl}</span>${chg}</div>`;
  }).join("");

  const charts = M.filter(([k]) => t.filter(x => x[k] != null).length >= 2)
    .map(([k, lbl]) => `<div class="mini"><h4>${lbl}</h4><div id="tm-${k}"></div></div>`)
    .join("");

  const filas = [...t].reverse().slice(0, 20).map(x => `<tr>
      <td>${longd(x.d)}</td>
      ${M.map(([k]) => `<td>${x[k] != null ? x[k].toFixed(1) : "—"}</td>`).join("")}
      <td class="nota">${x.tn ? x.tn : ""}</td>
    </tr>`).join("");

  // asimetria: por eso se miden los dos lados por separado. Un brazo 1 cm
  // mayor que el otro no se ve en el espejo pero sale aqui.
  const PARES = [["tbi", "tbd", "Brazo"], ["tai", "tad", "Antebrazo"],
                 ["tmi", "tmd", "Muslo"], ["tgi", "tgd", "Gemelo"]];
  const asim = PARES.filter(([i, d]) => last[i] != null && last[d] != null)
    .map(([i, d, lbl]) => {
      const dif = last[d] - last[i];
      return `<div class="tile"><span class="v ${Math.abs(dif) >= 1 ? "down" : "flat"}">${
        dif > 0 ? "+" : ""}${dif.toFixed(1)}<em>cm</em></span>
        <span class="l">${lbl}: der − izq</span></div>`;
    }).join("");

  const desde = longd(t[0].d);
  const html = `
    ${asim ? `<div class="card">
      <h3>Asimetría</h3>
      <p class="note">Derecho menos izquierdo, en la última tanda (${longd(last.d)}).
        Por debajo de 1 cm es ruido de medición; por encima, algo que mirar</p>
      <div class="tiles wide">${asim}</div>
    </div>` : ""}
    <div class="card">
      <h3>Cinta métrica</h3>
      <p class="note">${longd(last.d)}${prev ? " · el cambio es frente a la medición anterior, "
        + longd(prev.d) : ""}</p>
      <div class="tiles wide">${tiles}</div>
    </div>
    ${charts ? `<div class="card">
      <h3>Evolución de las medidas</h3>
      <p class="note">${t.length} mediciones desde ${desde}</p>
      <div class="minigrid">${charts}</div>
    </div>` : ""}
    <div class="card">
      <h3>Historial de medidas</h3>
      <div class="tblwrap"><table>
        <thead><tr><th>Fecha</th>${M.map(([, l]) => `<th>${l} (cm)</th>`).join("")}
          <th>Nota</th></tr></thead>
        <tbody>${filas}</tbody></table></div>
    </div>`;

  const pintar = () => {
    M.forEach(([k, lbl]) => {
      const box = $("#tm-" + k);
      if (!box) return;
      const col = k === "tab" || k === "tci" || k === "tca" ? PAL.down : PAL.up;
      lineChart(box, t, k, { color: col, unit: "cm", label: lbl, h: 150 });
      ampliable(box.closest(".mini"), {
        titulo: lbl,
        nota: `${t.filter(x => x[k] != null).length} mediciones desde ${desde}`,
        stats: resumen(t, k, 1, "cm"),
        dibuja: c => lineChart(c, t, k, { color: col, unit: "cm", h: 430 }),
      });
    });
  };

  return { html, pintar };
}

/* ================= resumen ================= */

const IN = DATA.insights || {};

const num = (v, d = 0) => v == null ? "—" : v.toLocaleString("es-ES",
  { minimumFractionDigits: d, maximumFractionDigits: d });

function delta(act, prev, { dec = 0, bueno = true, unidad = "" } = {}) {
  if (act == null || prev == null) return "";
  const d = act - prev;
  if (Math.abs(d) < (dec ? 0.05 : 0.5)) return `<span class="flat">igual</span>`;
  const cls = (d > 0) === bueno ? "up" : "down";
  return `<span class="${cls}">${d > 0 ? "+" : ""}${num(d, dec)}${unidad}</span>`;
}

function tablaComparativa(a, b, etiquetas, filas) {
  return `<table class="cmp">
    <thead><tr><th></th><th>${etiquetas[0]}</th><th>${etiquetas[1]}</th><th>Cambio</th></tr></thead>
    <tbody>${filas.map(([k, lbl, dec, bueno, u]) => `<tr>
      <td>${lbl}</td>
      <td>${num(a[k], dec)}${u || ""}</td>
      <td>${num(b[k], dec)}${u || ""}</td>
      <td>${delta(a[k], b[k], { dec, bueno, unidad: u || "" })}</td>
    </tr>`).join("")}</tbody></table>`;
}

/* Series efectivas por músculo y semana, contra una referencia externa.

   Sustituye a comparar tu reparto contra tu propio histórico: con cinco
   semanas de datos, el histórico ES el último mes, todos los desvíos salen
   ~0 y el aviso "estás descuidando X" no puede saltar nunca. Aquí la
   referencia es el rango que se suele recomendar (10-20 series por grupo y
   semana), que no depende de cuánta historia tengas.                        */
function seriesPorMusculo(ss) {
  const ms = (ss && ss.musculos) || [];
  if (!ms.length) return `<p class="blank">Sin entrenos suficientes.</p>`;
  const max = Math.max(...ms.map(m => Math.max(m.media, 22)), 1);
  const cls = e => e === "bajo" ? "down" : e === "alto" ? "flat" : "up";

  return `<div class="bal">${ms.map(m => `
    <div class="fila">
      <span class="nom" title="${m.musculo}">${m.musculo}</span>
      <span class="barra" title="Semana a semana: ${m.serie.join(", ")}">
        <i style="width:${(m.media / max * 100).toFixed(1)}%;
           background:var(--${cls(m.estado)})"></i>
        <u style="left:${(10 / max * 100).toFixed(1)}%" title="10 series"></u>
        <u style="left:${(20 / max * 100).toFixed(1)}%" title="20 series"></u>
      </span>
      <span class="val">${num(m.media, 1)}${m.semanas_cero
        ? `<span class="m" style="color:var(--ink-3)"> · ${m.semanas_cero}/${
           ss.n_semanas} sem a 0</span>` : ""}</span>
    </div>`).join("")}</div>
  <p class="note" style="margin-top:12px">Media de series efectivas por semana en
    las últimas ${ss.n_semanas} semanas (${num(ss.total_medio, 0)} en total). Las
    dos marcas grises son 10 y 20 series, el rango donde suele estar el trabajo
    que rinde. Pasa el ratón por una barra para ver semana a semana.</p>`;
}

function avisos() {
  const out = [];

  // lo que falta contra una referencia externa, no contra tu propio histórico
  const ss = IN.series_semanales || {};
  const bajos = (ss.musculos || []).filter(m => m.estado === "bajo")
    .sort((a, b) => a.media - b.media);
  if (bajos.length) {
    const peor = bajos[bajos.length - 1];
    out.push(["🦵", `Por debajo de 10 series semanales: <b>${
      bajos.map(m => m.musculo).join(", ")}</b>. ${peor.musculo} va a
      ${num(peor.media, 1)} series de media y ha estado a cero
      ${peor.semanas_cero} de las ${ss.n_semanas} semanas.`]);
  }
  const altos = (ss.musculos || []).filter(m => m.estado === "alto");
  if (altos.length) {
    out.push(["📈", `Por encima de 22 series semanales: <b>${
      altos.map(m => `${m.musculo} (${num(m.media, 1)})`).join(", ")}</b>.
      Más no siempre es mejor si otros grupos van a cero.`]);
  }

  const en = IN.energia || {};
  if (en.balance_kcal != null) {
    const d = en.balance_kcal;
    out.push([d < -100 ? "🔥" : d > 100 ? "🍽️" : "⚖️",
      Math.abs(d) < 100
        ? `El peso lleva ${en.dias} días plano: estás comiendo más o menos lo
           que gastas.`
        : `El peso va a <b>${num(en.kg_semana, 2)} kg por semana</b>, que es un
           ${d < 0 ? "déficit" : "superávit"} de <b>${num(Math.abs(d))} kcal al
           día</b>${en.ingesta_estimada ? `; comiendo en torno a
           ${num(en.ingesta_estimada)} kcal` : ""}.`]);
  }

  const ci = IN.cinta || {};
  if (ci.toca) {
    out.push(["📏", ci.tandas
      ? `Hace <b>${ci.dias} días</b> de la última tanda de cinta métrica
         (toca cada ${ci.cada}).`
      : `No has tomado ninguna medida de cinta todavía.`]);
  }

  const c = IN.cuerpo || {};
  if (c.grasa_kg?.d90 != null && c.musculo?.d90 != null) {
    const g = c.grasa_kg.d90, m = c.musculo.d90;
    if (Math.abs(g) > 1 || Math.abs(m) > 1) {
      const parte = g + m === 0 ? 0 : Math.abs(g) / (Math.abs(g) + Math.abs(m)) * 100;
      const verbo = (x) => x > 0 ? "sumado" : "perdido";
      const mismo = (g > 0) === (m > 0);
      out.push([g > 0 ? "⚖️" : "🔥",
        mismo
          ? `En 90 días has ${verbo(g)} <b>${num(Math.abs(g), 1)} kg de grasa</b> y
             <b>${num(Math.abs(m), 1)} kg de músculo</b>. El ${num(parte, 0)}% de lo
             ${g > 0 ? "ganado" : "perdido"} es grasa.`
          : `En 90 días has ${verbo(g)} <b>${num(Math.abs(g), 1)} kg de grasa</b> y
             ${verbo(m)} <b>${num(Math.abs(m), 1)} kg de músculo</b>.`]);
    }
  }
  const est = IN.ejercicios || [];
  const abandonados = est.filter(e => e.estado === "abandonado").length;
  if (abandonados) {
    const cerca = est.filter(e => e.estado === "abandonado")
      .sort((a, b) => a.dias - b.dias).slice(0, 2).map(e => e.titulo);
    out.push(["📉", `<b>${abandonados} ejercicios</b> llevan más de dos meses sin tocarse.
      Los más recientes: ${cerca.join(", ")}.`]);
  }
  const r = IN.rachas || {};
  if (r.actual >= 3) {
    out.push(["🔥", `Llevas <b>${r.actual} semanas seguidas</b> entrenando.
      Tu mejor racha son ${r.mejor}.`]);
  }
  return out;
}

function sectionResumen() {
  const el = $("#sec-resumen");
  // Los entrenos se cuentan desde un corte (cambio de gimnasio). Decirlo evita
  // que parezca que falta historia, y avisa de contra qué se compara.
  const aviso = DATA.desde ? `<div class="card"><h3>Desde ${longd(DATA.desde)}</h3>
    <p class="note">Solo cuentan los entrenos a partir de esa fecha, cuando
    cambiaste de gimnasio. Los anteriores siguen en Hevy, pero no entran en
    récords, progresiones ni volumen: otras máquinas y otras poleas hacen que
    60 kg allí no sean 60 kg aquí.</p></div>` : "";
  const s = IN.semana || {}, sp = IN.semana_previa || {};
  const m = IN.mes || {}, mp = IN.mes_previo || {};
  const c = IN.cuerpo || {};
  const r = IN.rachas || {};
  const est = IN.ejercicios || [];
  const cuenta = e => est.filter(x => x.estado === e).length;

  const cuerpoFilas = [
    ...(c.tendencia?.actual != null ? [["tendencia", "Peso (tendencia 7 d)", "kg", 1, false]] : []),
    ["peso", "Peso", "kg", 1, false],
    ["grasa_kg", "Grasa", "kg", 1, false],
    ["musculo", "Músculo", "kg", 1, true],
    ["visceral", "Grasa visceral", "", 1, false],
  ].filter(([k]) => c[k]?.actual != null);

  el.innerHTML = `<div class="cards">${aviso}

    <div class="card">
      <h3>Cómo vas</h3>
      <p class="note">Lo que ha cambiado, no lo que hay</p>
      <div class="pills">
        <span class="pill">Racha <b>${r.actual || 0}</b> semanas</span>
        <span class="pill">Mejor <b>${r.mejor || 0}</b></span>
        <span class="pill">Último entreno hace <b>${r.dias_desde ?? "—"}</b> d</span>
        <span class="pill">Progresan <b>${cuenta("progresa")}</b></span>
        <span class="pill">Estancados <b>${cuenta("estancado")}</b></span>
        <span class="pill">Abandonados <b>${cuenta("abandonado")}</b></span>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
        ${avisos().map(([ic, t]) =>
          `<div class="aviso"><span class="ic">${ic}</span><span>${t}</span></div>`).join("")}
      </div>
    </div>

    <div class="duo">
      <div class="card"><h3>Esta semana</h3>
        <p class="note">${s.desde} → ${s.hasta}, frente a los 7 días anteriores</p>
        ${tablaComparativa(s, sp, ["Ahora", "Antes"], [
          ["sesiones", "Sesiones", 0, true, ""],
          ["volumen", "Volumen", 0, true, " kg"],
          ["series", "Series", 0, true, ""],
          ["minutos", "Minutos", 0, true, ""],
          ["pasos", "Pasos/día", 0, true, ""],
          ["sueno", "Sueño", 2, true, " h"],
        ])}
      </div>
      <div class="card"><h3>Este mes</h3>
        <p class="note">Últimos 30 días, frente a los 30 anteriores</p>
        ${tablaComparativa(m, mp, ["Ahora", "Antes"], [
          ["sesiones", "Sesiones", 0, true, ""],
          ["volumen", "Volumen", 0, true, " kg"],
          ["series", "Series", 0, true, ""],
          ["minutos", "Minutos", 0, true, ""],
          ["pasos", "Pasos/día", 0, true, ""],
          ["sueno", "Sueño", 2, true, " h"],
        ])}
      </div>
    </div>

    <div class="duo">
      <div class="card"><h3>Series por músculo</h3>
        <p class="note">Media semanal contra el rango que rinde, no contra tu histórico</p>
        ${seriesPorMusculo(IN.series_semanales || {})}
      </div>
      <div class="card"><h3>Composición corporal</h3>
        <p class="note">${cuerpoFilas.length
          ? "Cambio a 7, 30 y 90 días · una casilla vacía es que no hubo pesaje cerca"
          : ""}</p>
        ${cuerpoFilas.length ? `<table class="cmp">
          <thead><tr><th></th><th>Ahora</th><th>7 d</th><th>30 d</th><th>90 d</th></tr></thead>
          <tbody>${cuerpoFilas.map(([k, lbl, u, dec, bueno]) => `<tr>
            <td>${lbl}</td>
            <td>${num(c[k].actual, dec)}${u}</td>
            ${[7, 30, 90].map(dd => `<td${c[k]["n" + dd] ? ` title="${c[k]["n" + dd]} días reales"` : ""}>${
              c[k]["d" + dd] == null ? "—" : delta(c[k].actual, c[k].actual - c[k]["d" + dd],
                                                   { dec, bueno })}</td>`).join("")}
          </tr>`).join("")}</tbody></table>`
        : `<p class="blank">Sin pesajes suficientes.</p>`}
      </div>
    </div>

  </div>`;
}

/* ================= navegación ================= */

let built = {};
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  const t = b.dataset.t;
  document.querySelectorAll(".tab").forEach(x =>
    x.setAttribute("aria-selected", String(x.dataset.t === t)));
  ["resumen", "fuerza", "actividad", "cuerpo"].forEach(k =>
    $("#sec-" + k).hidden = k !== t);
  if (!built[t]) {
    if (t === "fuerza") render();
    if (t === "actividad") sectionActividad();
    if (t === "cuerpo") sectionCuerpo();
    built[t] = true;
  }
});

sectionResumen();
</script>
